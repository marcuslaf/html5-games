<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', sans-serif;
            color: #e0e0e0;
        }
        h1 {
            margin-bottom: 10px;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff8855;
        }
        #score {
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        canvas {
            border: 2px solid #00ff88;
            border-radius: 4px;
            box-shadow: 0 0 20px #00ff8833;
        }
        #instructions {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #888;
        }
        #gameOver {
            display: none;
            position: absolute;
            background: #000000dd;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 2px solid #ff4444;
        }
        #gameOver h2 { color: #ff4444; margin-bottom: 10px; }
        #gameOver button {
            margin-top: 15px;
            padding: 10px 25px;
            background: #00ff88;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
        }
        #gameOver button:hover { background: #00cc6a; }
    </style>
</head>
<body>
    <h1>🐍 Snake Game</h1>
    <div id="score">Pontos: <span id="points">0</span></div>
    <canvas id="game" width="400" height="400"></canvas>
    <div id="instructions">Setas ou WASD para mover | ESPAÇO para pausar</div>
    
    <div id="gameOver">
        <h2>Game Over!</h2>
        <p>Pontos finais: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Jogar Novamente</button>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1, dy = 0;
        let score = 0;
        let gameOver = false;
        let paused = false;
        let lastTime = 0;
        const gameSpeed = 100;

        function spawnFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Evita spawn na cobra
            for (const part of snake) {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                    return;
                }
            }
        }

        function draw() {
            // Background
            ctx.fillStyle = '#16213e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid sutil
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Comida
            ctx.fillStyle = '#ff4757';
            ctx.shadowColor = '#ff4757';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0, Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;

            // Cobra
            snake.forEach((part, i) => {
                const isHead = i === 0;
                const brightness = 1 - (i / snake.length) * 0.5;
                ctx.fillStyle = isHead ? '#00ff88' : `rgb(0, ${Math.floor(200 * brightness)}, ${Math.floor(100 * brightness)})`;
                
                if (isHead) {
                    ctx.shadowColor = '#00ff88';
                    ctx.shadowBlur = 8;
                }
                
                ctx.fillRect(
                    part.x * gridSize + 1,
                    part.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
                ctx.shadowBlur = 0;
            });

            // Pausa
            if (paused && !gameOver) {
                ctx.fillStyle = '#000000aa';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#00ff88';
                ctx.font = 'bold 30px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('PAUSADO', canvas.width / 2, canvas.height / 2);
            }
        }

        function update() {
            if (gameOver || paused) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Wrap around
            if (head.x < 0) head.x = tileCount - 1;
            if (head.x >= tileCount) head.x = 0;
            if (head.y < 0) head.y = tileCount - 1;
            if (head.y >= tileCount) head.y = 0;

            // Colisão com herself
            for (const part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // Comeu comida?
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('points').textContent = score;
                spawnFood();
            } else {
                snake.pop();
            }
        }

        function gameLoop(timestamp) {
            if (timestamp - lastTime >= gameSpeed) {
                update();
                draw();
                lastTime = timestamp;
            }
            if (!gameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        function endGame() {
            gameOver = true;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function restartGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            gameOver = false;
            paused = false;
            document.getElementById('points').textContent = 0;
            document.getElementById('gameOver').style.display = 'none';
            spawnFood();
            requestAnimationFrame(gameLoop);
        }

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            // Pausa
            if (key === ' ') {
                paused = !paused;
                if (!paused && !gameOver) draw();
                return;
            }

            // Movimento
            if ((key === 'arrowup' || key === 'w') && dy === 0) { dx = 0; dy = -1; }
            if ((key === 'arrowdown' || key === 's') && dy === 0) { dx = 0; dy = 1; }
            if ((key === 'arrowleft' || key === 'a') && dx === 0) { dx = -1; dy = 0; }
            if ((key === 'arrowright' || key === 'd') && dx === 0) { dx = 1; dy = 0; }
        });

        // Iniciar
        spawnFood();
        draw();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
