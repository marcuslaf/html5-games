<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breakout Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f23;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }
    canvas {
      display: block;
      border: 2px solid #333366;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 168, 255, 0.15);
    }
    #instructions {
      margin-top: 12px;
      font-size: 13px;
      color: #8888aa;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="480" height="400"></canvas>
  <div id="instructions">Mouse ou Setas/WASD para mover | ESPACO para pausar</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    // ---------- Estado do Jogo ----------
    let state = 'menu'; // menu | playing | paused | gameover | win
    let score = 0;
    let lives = 3;

    // ---------- Barra ----------
    const paddle = { w: 90, h: 14, x: 0, speed: 7, color1: '#00a8ff', color2: '#0055ff' };
    paddle.x = (W - paddle.w) / 2;
    let paddleDir = 0; // -1 esquerda, 0 parado, 1 direita

    // ---------- Bola ----------
    const ball = { r: 6, x: W / 2, y: H - 40, dx: 4, dy: -4, speed: 4 };

    // ---------- Tijolos ----------
    const brickRows = 5;
    const brickCols = 10;
    const brickW = 42;
    const brickH = 16;
    const brickPad = 4;
    const brickOffsetTop = 50;
    const brickOffsetLeft = (W - (brickCols * (brickW + brickPad) - brickPad)) / 2;

    const rowColors = [
      { fill: '#ff3344', glow: '#ff334488', pts: 50 },
      { fill: '#ff8c00', glow: '#ff8c0088', pts: 40 },
      { fill: '#ffdd00', glow: '#ffdd0088', pts: 30 },
      { fill: '#33cc55', glow: '#33cc5588', pts: 20 },
      { fill: '#3399ff', glow: '#3399ff88', pts: 10 },
    ];

    let bricks = [];

    function createBricks() {
      bricks = [];
      for (let r = 0; r < brickRows; r++) {
        for (let c = 0; c < brickCols; c++) {
          bricks.push({
            x: brickOffsetLeft + c * (brickW + brickPad),
            y: brickOffsetTop + r * (brickH + brickPad),
            w: brickW,
            h: brickH,
            alive: true,
            row: r,
            color: rowColors[r].fill,
            glow: rowColors[r].glow,
            pts: rowColors[r].pts,
          });
        }
      }
    }

    // ---------- Entrada ----------
    const keys = {};
    let mouseX = W / 2;
    let useMouseControl = false;

    document.addEventListener('keydown', (e) => {
      keys[e.key] = true;
      if (e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        if (state === 'playing') {
          state = 'paused';
        } else if (state === 'paused') {
          state = 'playing';
        }
      }
    });
    document.addEventListener('keyup', (e) => { keys[e.key] = false; });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouseX = (e.clientX - rect.left) * (W / rect.width);
      useMouseControl = true;
    });
    canvas.addEventListener('click', () => {
      if (state === 'menu' || state === 'gameover' || state === 'win') {
        startGame();
      }
    });

    // ---------- Reset ----------
    function resetBall() {
      ball.x = W / 2;
      ball.y = H - 40;
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
      ball.dx = ball.speed * Math.cos(angle);
      ball.dy = ball.speed * Math.sin(angle);
    }

    function startGame() {
      score = 0;
      lives = 3;
      paddle.x = (W - paddle.w) / 2;
      createBricks();
      resetBall();
      state = 'playing';
    }

    // ---------- Atualização ----------
    function update() {
      if (state !== 'playing') return;

      // Barra - mouse
      if (useMouseControl) {
        paddle.x = mouseX - paddle.w / 2;
      }
      // Barra - teclado
      if (keys['ArrowLeft'] || keys['a'] || keys['A']) paddleDir = -1;
      else if (keys['ArrowRight'] || keys['d'] || keys['D']) paddleDir = 1;
      else paddleDir = 0;

      if (!useMouseControl) {
        paddle.x += paddleDir * paddle.speed;
      }
      paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));

      // Bola
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Paredes laterais
      if (ball.x - ball.r <= 0) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); }
      if (ball.x + ball.r >= W) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); }
      // Parede superior
      if (ball.y - ball.r <= 0) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); }

      // Caiu embaixo
      if (ball.y + ball.r >= H) {
        lives--;
        if (lives <= 0) {
          state = 'gameover';
          return;
        }
        resetBall();
        return;
      }

      // Colisão com barra
      if (
        ball.dy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y + ball.r <= paddle.y + paddle.h + 4 &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.w
      ) {
        const hitPos = (ball.x - paddle.x) / paddle.w; // 0..1
        const angle = (hitPos - 0.5) * Math.PI * 0.7; // -63..+63 graus
        ball.dx = ball.speed * Math.sin(angle);
        ball.dy = -ball.speed * Math.cos(angle);
        ball.y = paddle.y - ball.r;
      }

      // Colisão com tijolos
      for (const b of bricks) {
        if (!b.alive) continue;
        if (
          ball.x + ball.r > b.x &&
          ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y &&
          ball.y - ball.r < b.y + b.h
        ) {
          b.alive = false;
          score += b.pts;

          // Determinar lado da colisão
          const overlapLeft = (ball.x + ball.r) - b.x;
          const overlapRight = (b.x + b.w) - (ball.x - ball.r);
          const overlapTop = (ball.y + ball.r) - b.y;
          const overlapBottom = (b.y + b.h) - (ball.y - ball.r);
          const minOverlap = Math.min(overlapLeft, overlapRight, overlapTop, overlapBottom);

          if (minOverlap === overlapLeft || minOverlap === overlapRight) {
            ball.dx = -ball.dx;
          } else {
            ball.dy = -ball.dy;
          }
          break; // apenas um tijolo por frame
        }
      }

      // Vitória
      if (bricks.every((b) => !b.alive)) {
        state = 'win';
      }
    }

    // ---------- Renderização ----------
    function drawPaddle() {
      const grad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
      grad.addColorStop(0, paddle.color1);
      grad.addColorStop(1, paddle.color2);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();
    }

    function drawBall() {
      ctx.save();
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 12;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBricks() {
      for (const b of bricks) {
        if (!b.alive) continue;
        ctx.save();
        ctx.shadowColor = b.glow;
        ctx.shadowBlur = 6;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawHUD() {
      // Pontos
      ctx.fillStyle = '#ffffff';
      ctx.font = '16px Segoe UI, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Pontos: ' + score, 12, 24);

      // Vidas
      ctx.textAlign = 'right';
      let hearts = '';
      for (let i = 0; i < lives; i++) hearts += '\u2764 ';
      ctx.fillText(hearts, W - 12, 24);
    }

    function drawOverlay(title, subtitle) {
      ctx.fillStyle = 'rgba(15, 15, 35, 0.82)';
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 32px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, W / 2, H / 2 - 30);

      ctx.font = '16px Segoe UI, sans-serif';
      ctx.fillStyle = '#aaaacc';
      ctx.fillText(subtitle, W / 2, H / 2 + 10);

      ctx.font = '14px Segoe UI, sans-serif';
      ctx.fillStyle = '#6688cc';
      ctx.fillText('Clique ou pressione ENTER para jogar', W / 2, H / 2 + 45);
    }

    function drawPausedOverlay() {
      ctx.fillStyle = 'rgba(15, 15, 35, 0.6)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px Segoe UI, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSADO', W / 2, H / 2 - 10);
      ctx.font = '14px Segoe UI, sans-serif';
      ctx.fillStyle = '#8888aa';
      ctx.fillText('Pressione ESPACO para continuar', W / 2, H / 2 + 20);
    }

    function draw() {
      // Fundo
      ctx.fillStyle = '#0f0f23';
      ctx.fillRect(0, 0, W, H);

      drawBricks();
      drawPaddle();
      drawBall();
      drawHUD();

      if (state === 'menu') {
        drawOverlay('BREAKOUT', 'Destrua todos os tijolos!');
      } else if (state === 'paused') {
        drawPausedOverlay();
      } else if (state === 'gameover') {
        drawOverlay('GAME OVER', 'Pontuacao final: ' + score);
      } else if (state === 'win') {
        drawOverlay('VITORIA!', 'Voce destruiu todos os tijolos! | ' + score + ' pontos');
      }
    }

    // ---------- Loop ----------
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // ---------- Início ----------
    createBricks();
    paddle.y = H - 30;
    loop();
  </script>
</body>
</html>
